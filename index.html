<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalha Naval Quiz Oficial</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="game-container">
        <h1>Batalha Naval Quiz 👥</h1>
        
        <!-- HUD contendo apenas as caixas de pontuação -->
        <div class="hud">
            <div class="player-info p1 active" id="p1-panel">
                <h3>Jogador 1 (Azul)</h3>
                <p>Pontos: <span id="p1-score">0</span> pts</p>
            </div>
            <div class="player-info p2" id="p2-panel">
                <h3>Jogador 2 (Laranja)</h3>
                <p>Pontos: <span id="p2-score">0</span> pts</p>
            </div>
        </div>

        <button id="reset-btn" class="btn-reiniciar" onclick="resetGame()">Reiniciar Jogo</button>
        <!-- CORRIGIDO: Removemos os blocos rígidos de coordenadas manuais do HTML -->
        <div class="board-wrapper">
            <!-- Deixamos apenas a div do grid vazia para o JS preencher perfeitamente -->
            <div id="grid"></div>
        </div>

        <!-- Legenda de cores do jogo -->
        <div class="legenda-container">
            <h3>Identificação dos Alvos</h3>
            <div class="legenda-grid">
                <div class="legenda-item"><span class="cor-box vermelho"></span> Porta-Aviões (4 blocos)</div>
                <div class="legenda-item"><span class="cor-box verde"></span> Encouraçado (3 blocos)</div>
                <div class="legenda-item"><span class="cor-box amarelo"></span> Contratorpedeiro (2 blocos)</div>
                <div class="legenda-item"><span class="cor-box roxo"></span> Submarino (2 blocos)</div>
                <div class="legenda-item"><span class="cor-box ciano"></span> Navio de Patrulha (1 bloco)</div>
                <div class="legenda-item"><span class="cor-box azul-claro"></span> Água / Erro</div>
            </div>
        </div>
    </div>

    <!-- Janela Flutuante do Quiz -->
    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="turn-announcer">Vez do Jogador</h2>
            <h3 id="question-text">Pergunta</h3>
            <div id="options-container"></div>
        </div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
